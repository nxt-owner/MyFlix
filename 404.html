<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFlix - Cinema Portal</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- OpenGraph Meta Tags for WhatsApp, Facebook, Telegram & Social Media -->
    <meta property="og:site_name" content="MyFlix Cinema">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://myflix.techlasiya.com/">
    <meta property="og:title" content="MyFlix - Your Ultimate Cinema Experience">
    <meta property="og:description"
        content="Stream thousands of blockbuster movies and TV series in stunning 4K detail. Built-in Ad-Block Shield, 5 fast servers, and Sinhala subtitles.">
    <meta property="og:image" content="https://myflix.techlasiya.com/og_image.png">
    <meta property="og:image:secure_url" content="https://myflix.techlasiya.com/og_image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="MyFlix - Your Ultimate Cinema Experience">

    <!-- Secondary OG image fallback (JPEG) -->
    <meta property="og:image" content="https://myflix.techlasiya.com/og_image.jpg">
    <meta property="og:image:secure_url" content="https://myflix.techlasiya.com/og_image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://myflix.techlasiya.com/">
    <meta name="twitter:title" content="MyFlix - Your Ultimate Cinema Experience">
    <meta name="twitter:description"
        content="Stream thousands of movies and TV shows in stunning detail with Sinhala subtitles and Ad-Block player.">
    <meta name="twitter:image" content="https://myflix.techlasiya.com/og_image.png">
    <meta name="twitter:image:alt" content="MyFlix Cinema Experience">

    <!-- Schema.org Microdata for WhatsApp & Search Bots -->
    <meta itemprop="name" content="MyFlix - Your Ultimate Cinema Experience">
    <meta itemprop="description"
        content="Stream thousands of blockbuster movies and TV series in stunning 4K detail. Built-in Ad-Block Shield, 5 fast servers, and Sinhala subtitles.">
    <meta itemprop="image" content="https://myflix.techlasiya.com/og_image.png">
    <link rel="image_src" href="https://myflix.techlasiya.com/og_image.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Standalone resilience styling for GitHub Pages & Local fallbacks */
        :root {
            --bg-main: #06050b;
            --bg-card: rgba(18, 14, 30, 0.85);
            --primary: #8b5cf6;
            --primary-light: #c084fc;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --gradient-primary: linear-gradient(135deg, #8b5cf6 0%, #d946ef 50%, #ec4899 100%);
            --gradient-btn: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #c026d3 100%);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --border-glass: rgba(255, 255, 255, 0.1);
            --radius-md: 14px;
            --radius-xl: 24px;
            --radius-pill: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
        }

        .glass-nav {
            padding: 18px 24px;
            background: rgba(6, 5, 11, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn-nav-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-pill);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-nav-home:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .portal-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .portal-card {
            background: var(--bg-card);
            border: 1px solid rgba(192, 132, 252, 0.25);
            border-radius: var(--radius-xl);
            padding: 50px 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(24px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(139, 92, 246, 0.15);
            position: relative;
        }

        .portal-icon-box {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: var(--gradient-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #ffffff;
            box-shadow: 0 8px 24px var(--primary-glow);
        }
        .portal-icon-box svg {
            width: 32px;
            height: 32px;
        }

        .portal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-light);
            margin-bottom: 16px;
        }

        .portal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .portal-desc {
            font-size: 1.02rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .text-gradient {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .portal-cta-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-portal-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--gradient-btn);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 24px;
            border-radius: var(--radius-md);
            color: #ffffff;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 8px 24px var(--primary-glow);
            transition: all 0.25s ease;
        }
        .btn-portal-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.6);
        }

        .btn-portal-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            padding: 13px 24px;
            border-radius: var(--radius-md);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.94rem;
            transition: all 0.25s ease;
        }
        .btn-portal-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .portal-timer-notice {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 14px;
        }
    </style>
</head>

<body>
    <!-- Top Bar -->
    <nav class="glass-nav">
        <a href="index.html" class="brand-link">
            <img src="logo.png" alt="MyFlix App Icon" class="brand-icon" id="navLogo">
            <span>MY<span style="color: var(--primary-light);">FLIX</span></span>
        </a>
        <a href="index.html" class="btn-nav-home" id="navHomeBtn">
            <i data-lucide="home"></i>
            <span>Home</span>
        </a>
    </nav>

    <!-- Main Dynamic Portal -->
    <main class="portal-container">
        <div class="portal-card" id="portalCard">
            <div class="portal-icon-box" id="portalIcon">
                <i data-lucide="film"></i>
            </div>
            <div class="portal-badge" id="portalBadge">Processing Request...</div>
            <h1 class="portal-title" id="portalTitle">Connecting to Cinema...</h1>
            <p class="portal-desc" id="portalDesc">Please wait while we route your destination.</p>

            <div class="portal-cta-group" id="portalCtaGroup">
                <a href="index.html" class="btn-portal-primary">
                    <span>Return to Homepage</span>
                </a>
            </div>
            <div class="portal-timer-notice" id="portalTimer"></div>
        </div>
    </main>

    <script>

        // Deep Link detection logic
        const path = window.location.pathname;
        let deepLink = null;
        if (path && path !== "/" && !path.endsWith("404.html")) {
            const parts = path.split('/').filter(Boolean);
            for (let i = 0; i < parts.length - 1; i++) {
                const seg = parts[i].toLowerCase();
                if (seg === 'movie' || seg === 'tv') {
                    deepLink = {
                        type: seg,
                        id: parts[i + 1]
                    };
                    break;
                }
            }
        }

        const portalBadge = document.getElementById('portalBadge');
        const portalIcon = document.getElementById('portalIcon');
        const portalTitle = document.getElementById('portalTitle');
        const portalDesc = document.getElementById('portalDesc');
        const portalCtaGroup = document.getElementById('portalCtaGroup');
        const portalTimer = document.getElementById('portalTimer');

        if (deepLink) {
            const { type, id } = deepLink;
            const typeLabel = type === 'tv' ? 'TV Series' : 'Movie';
            const appUrl = `slcinema://app/${type}/${id}`;
            const apkUrl = "https://github.com/nxt-owner/MyFlix/releases/download/V2.4.0/MyFlix-V2.4.0.apk";

            document.title = `MyFlix - Opening ${typeLabel}...`;
            portalBadge.innerHTML = `<span style="width:8px;height:8px;background:#10b981;border-radius:50%;display:inline-block;"></span> Deep-Link Detected`;
            portalIcon.innerHTML = `<i data-lucide="play-circle"></i>`;
            portalTitle.innerHTML = `Opening in <span class="text-gradient">MyFlix App</span>`;
            portalDesc.innerHTML = `Launching this <strong>${typeLabel}</strong> directly in high definition on your MyFlix player.`;

            portalCtaGroup.innerHTML = `
                <a href="${appUrl}" class="btn-portal-primary">
                    <i data-lucide="play"></i>
                    <span>Open in MyFlix App</span>
                </a>
                <a href="${apkUrl}" class="btn-portal-secondary" download>
                    <i data-lucide="download"></i>
                    <span>Don't have the app? Download APK</span>
                </a>
                <a href="index.html" style="color: var(--text-muted); font-size: 0.88rem; text-decoration: none; margin-top: 6px;">
                    &larr; Return to MyFlix Homepage
                </a>
            `;

            let secondsLeft = 2;
            portalTimer.innerText = `Auto-launching in ${secondsLeft}s...`;
            const interval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    portalTimer.innerText = `Auto-launching in ${secondsLeft}s...`;
                } else {
                    clearInterval(interval);
                    portalTimer.innerText = `If the app didn't open automatically, tap 'Open in MyFlix App' above.`;
                    window.location.href = appUrl;
                }
            }, 1000);

        } else {
            // Standard 404 Experience
            document.title = "404 - Scene Not Found | MyFlix";
            portalBadge.innerHTML = `<i data-lucide="alert-circle"></i> 404 &bull; Missing Reel`;
            portalIcon.innerHTML = `<i data-lucide="film"></i>`;
            portalTitle.innerHTML = `Lost in the <span class="text-gradient">Cinema Void</span>`;
            portalDesc.innerHTML = `The scene or page you are looking for was cut from the final edit or never existed.`;

            portalCtaGroup.innerHTML = `
                <a href="index.html" class="btn-portal-primary">
                    <i data-lucide="home"></i>
                    <span>Return to Homepage</span>
                </a>
                <a href="https://github.com/nxt-owner/MyFlix/releases/download/V2.4.0/MyFlix-V2.4.0.apk" class="btn-portal-secondary" download>
                    <i data-lucide="download"></i>
                    <span>Download MyFlix App (APK)</span>
                </a>
            `;
            portalTimer.innerHTML = `<a href="index.html" style="color: var(--primary-light); text-decoration: none; font-size: 0.88rem;">&larr; Back to MyFlix Cinema</a>`;
        }

        lucide.createIcons();
    </script>
</body>

</html>
